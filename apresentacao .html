<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apresentação RRPs Q3</title>
<link rel="icon" type="image/png" href="favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@300;400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!--
  ============================================================
  APRESENTAÇÃO — RRPs Q3 PP4 PE7. Página independente do dashboard.
  Não altera o index.html: apenas LÊ a mesma planilha do Google Sheets
  (reservas: .xlsx do GitHub → últimos dados salvos pelo dashboard
  neste navegador → dados embutidos no index.html).

  Atalhos:  ← →  / Espaço / PageUp PageDown  navegar
            F  tela cheia      M  alternar Gerencial/Técnico
            R  recarregar dados    P  exportar PDF (imprimir)
  URL:      apresentacao.html?modo=tecnico   (padrão: gerencial)
  ============================================================
-->
<style>
  :root {
    --bg: #F4F1EC; --bg2: #EAE6DE; --surface: #FFFFFF;
    --border: #E0DBD2; --txt: #18150F; --txt2: #635C50; --txt3: #9E9487;
    --accent: #B5622A; --green: #27714A; --red: #AD2E2E; --amber: #A86E22;
    --olive: #4F6835; --purple: #4E4480; --teal: #256A62; --brown: #6E3E1C; --blue: #284F82;
    --stage: #18150F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--stage); font-family: 'Inter', sans-serif; color: var(--txt); overflow: hidden; }

  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #deck { position: relative; width: 1600px; height: 900px; transform-origin: center center; flex-shrink: 0; }
  .slide {
    position: absolute; inset: 0; background: var(--bg); border-radius: 6px; overflow: hidden;
    padding: 60px 80px 60px; display: flex; flex-direction: column;
    opacity: 0; visibility: hidden; transition: opacity .35s ease;
  }
  .slide.active { opacity: 1; visibility: visible; }

  .slide-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
  .kicker { font-size: 17px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
  h1, h2 { font-family: 'Syne', sans-serif; font-weight: 800; color: var(--txt); line-height: 1.05; letter-spacing: -.01em; }
  h2 { font-size: 50px; }
  .slide-foot { position: absolute; left: 80px; right: 80px; bottom: 22px; display: flex; justify-content: space-between; font-size: 15px; color: var(--txt3); }
  .body { flex: 1; min-height: 0; display: flex; gap: 28px; }
  .col { display: flex; flex-direction: column; gap: 20px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 26px 30px; box-shadow: 0 1px 3px rgba(0,0,0,.05), 0 4px 18px rgba(0,0,0,.04); }
  .card-t { font-size: 17px; font-weight: 600; color: var(--txt2); margin-bottom: 12px; }
  .muted { color: var(--txt2); }

  /* Capa */
  .cover { background: radial-gradient(circle at 85% 20%, #3a2a1c 0%, #18150F 60%); color: #fff; justify-content: center; }
  .cover h1 { color: #fff; font-size: 92px; margin: 14px 0 22px; }
  .cover h1 span { color: #E0915A; }
  .cover .kicker { color: #E0915A; font-size: 21px; }
  .cover .sub { font-size: 30px; color: #E8E1D6; font-weight: 300; }
  .cover .meta { margin-top: 60px; display: flex; gap: 56px; font-size: 19px; color: #B8AE9F; }
  .cover .meta b { display: block; font-size: 30px; color: #fff; font-weight: 600; margin-top: 6px; }
  .mode-pill { display: inline-block; padding: 8px 18px; border-radius: 999px; border: 1px solid #E0915A; color: #E0915A; font-size: 17px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }

  /* KPIs */
  .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; }
  .kpi { padding: 24px 26px; position: relative; overflow: hidden; }
  .kpi::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: var(--c, var(--accent)); }
  .kpi .lbl { font-size: 18px; color: var(--txt2); font-weight: 500; }
  .kpi .val { font-family: 'Syne', sans-serif; font-size: 64px; font-weight: 800; line-height: 1; margin-top: 14px; color: var(--c, var(--txt)); font-variant-numeric: tabular-nums; }
  .kpi .val small { font-size: 28px; font-weight: 600; color: var(--txt3); }
  .kpi .note { font-size: 16px; color: var(--txt3); margin-top: 10px; }
  .headline { font-size: 32px; line-height: 1.35; max-width: 1380px; }
  .headline b { color: var(--accent); }

  .pill { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 999px; font-size: 15px; font-weight: 600; white-space: nowrap; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .chart-box { position: relative; flex: 1; min-height: 0; }

  /* Tabelas */
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-size: 14px; font-weight: 600; color: var(--txt3); text-transform: uppercase; letter-spacing: .06em; padding: 10px 12px; border-bottom: 2px solid var(--border); }
  td { padding: 11px 12px; font-size: 18px; border-bottom: 1px solid var(--border); vertical-align: top; }
  td.num, th.num { text-align: right; }
  td.tag { font-weight: 700; white-space: nowrap; }
  td.txt { font-size: 16px; color: var(--txt2); line-height: 1.35; }

  /* Ranking de equipamentos */
  .rank-row { display: grid; grid-template-columns: 44px 150px 170px 1fr 60px 150px; align-items: center; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 19px; }
  .rank-row:last-child { border-bottom: none; }
  .rank-n { font-family: 'Syne'; font-weight: 800; color: var(--txt3); font-size: 20px; }
  .rank-n.top { color: var(--accent); }
  .stk { display: flex; height: 22px; border-radius: 11px; overflow: hidden; background: var(--bg2); }
  .stk span { height: 100%; }

  /* Heatmap */
  .hm { display: grid; gap: 8px; }
  .hm-cell { border-radius: 10px; height: 74px; display: flex; align-items: center; justify-content: center; font-family: 'Syne'; font-weight: 800; font-size: 30px; }
  .hm-lbl { display: flex; align-items: center; font-size: 19px; font-weight: 600; }
  .hm-h { text-align: center; font-size: 15px; color: var(--txt3); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }

  .empty { margin: auto; text-align: center; font-size: 32px; color: var(--green); font-weight: 600; }

  /* Controles */
  #controls {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 10;
    display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 14px;
    background: rgba(24,21,15,.9); color: #E8E1D6; font-size: 14px; backdrop-filter: blur(6px);
    transition: opacity .3s; box-shadow: 0 6px 24px rgba(0,0,0,.35);
  }
  #controls.hidden { opacity: 0; pointer-events: none; }
  #controls button { background: transparent; color: inherit; border: 1px solid rgba(232,225,214,.25); border-radius: 9px; padding: 8px 12px; font: inherit; cursor: pointer; white-space: nowrap; }
  #controls button:hover { background: rgba(232,225,214,.12); }
  #controls button.on { background: #B5622A; border-color: #B5622A; color: #fff; }
  #counter { min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
  #sync { font-size: 13px; color: #9E9487; padding: 0 6px; white-space: nowrap; }
  .seg { display: flex; }
  .seg button:first-child { border-radius: 9px 0 0 9px; }
  .seg button:last-child { border-radius: 0 9px 9px 0; border-left: none; }
  #progress { position: fixed; left: 0; top: 0; height: 4px; background: #B5622A; transition: width .3s; z-index: 10; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #E8E1D6; font-size: 20px; z-index: 20; background: var(--stage); }
  @media (max-width: 720px) {
    #controls { gap: 4px; padding: 6px; font-size: 12px; bottom: 8px; }
    #controls button { padding: 6px 8px; }
    #sync, .hide-sm { display: none; }
  }

  @page { size: 1600px 900px; margin: 0; }
  @media print {
    html, body { height: auto; overflow: visible; background: #fff; }
    #controls, #progress, #loading { display: none !important; }
    #stage { position: static; display: block; }
    #deck { transform: none !important; width: 1600px; height: auto; }
    .slide { position: relative; opacity: 1; visibility: visible; width: 1600px; height: 900px; border-radius: 0; page-break-after: always; break-after: page; transition: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div id="progress"></div>
<div id="loading">Carregando dados da planilha…</div>
<div id="stage"><div id="deck"></div></div>

<div id="controls">
  <button onclick="go(-1)" title="Anterior (←)">◀</button>
  <span id="counter">1 / 1</span>
  <button onclick="go(1)" title="Próximo (→)">▶</button>
  <div class="seg">
    <button id="btn-ger" onclick="setMode('gerencial')" title="Visão gerencial (M)">Gerencial</button>
    <button id="btn-tec" onclick="setMode('tecnico')" title="Visão técnica (M)">Técnico</button>
  </div>
  <button onclick="loadData()" title="Recarregar dados (R)">⟳</button>
  <button class="hide-sm" onclick="toggleFS()" title="Tela cheia (F)">⛶</button>
  <button class="hide-sm" onclick="window.print()" title="Exportar PDF (P)">PDF</button>
  <a href="index.html" style="color:inherit"><button class="hide-sm" title="Voltar ao dashboard">Dashboard</button></a>
  <span id="sync"></span>
</div>

<script>
// ============================================================
// FONTES DE DADOS (mesmas do dashboard)
// ============================================================
const GOOGLE_SHEETS_CSV_URL_RRP = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRR_wCPiWXn43YLde978m4oISTN63zPN0uaibIEafkHonKbLeOKLmsURnlosTtxyBKHENEzGnB__B8l/pub?gid=1184133260&single=true&output=csv';
const GITHUB_XLSX_URLS = [
  'https://raw.githubusercontent.com/vieiranixon/Dashboard-RRPs-Q3/main/dados/dados_rrp.xlsx',
  'https://raw.githubusercontent.com/vieiranixon/Dashboard-RRPs-Q3/main/dados_rrp.xlsx'
];
const LS_KEY = 'rrp_dashboard_data_v2';          // dados salvos pelo próprio dashboard
const AUTO_REFRESH_MS = 5 * 60 * 1000;

// Cores (mesma paleta do dashboard)
const C = { G: '#27714A', A: '#A86E22', R: '#AD2E2E', P: '#4E4480', O: '#4F6835', T: '#256A62', BR: '#6E3E1C', BL: '#284F82', GR: '#9E9487', ACC: '#B5622A' };
const ST_ORDER = ['Realizado', 'Pendente', 'Nota aberta', 'Em Andamento'];
const stColor = k => k === 'Realizado' ? C.G : k === 'Pendente' ? C.A : k === 'Nota aberta' ? C.P : k === 'Em Andamento' ? C.BL : C.GR;
const stSort = (a, b) => { const ia = ST_ORDER.indexOf(a), ib = ST_ORDER.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); };
const PRIOS = ['Alta', 'Média', 'Baixa'];
const prColor = p => p === 'Alta' ? C.R : p === 'Média' ? C.A : C.O;

// ============================================================
// LEITURA E NORMALIZAÇÃO (mesma lógica do iData/normMes do dashboard)
// ============================================================
const nrm = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
function normMes(v) {
  if (v === null || v === undefined || v === '') return 'N/A';
  if (typeof v === 'number') return new Date((v - 25569) * 86400000).toISOString().substring(0, 7);
  const s = String(v).trim();
  const mBar = s.match(/^(\d{1,2})\/(\d{2,4})$/);
  if (mBar) { const mm = mBar[1].padStart(2, '0'); let yy = mBar[2]; if (yy.length === 2) yy = '20' + yy; return yy + '-' + mm; }
  const mIso = s.match(/^(\d{4})-(\d{1,2})/);
  if (mIso) return mIso[1] + '-' + mIso[2].padStart(2, '0');
  return s.substring(0, 7) || 'N/A';
}
function rowsToRecords(rows) {
  const ks = [...new Set(rows.flatMap(r => Object.keys(r)))];
  const fc = (...ns) => ks.find(k => ns.some(n => nrm(k).includes(nrm(n))));
  const uC = fc('unidade'), sC = fc('setor'), tC = fc('tag'), mC = fc('mes', 'month'), pC = fc('prioridade'), stC = fc('status'),
        tmC = fc('tempo', 'dias'), rC = fc('recomendacao', 'recomendação'), anC = fc('anomalia');
  return rows.map(r => ({
    unidade: r[uC] || 'N/A', setor: r[sC] || 'N/A', tag: r[tC] || 'N/A', mes: normMes(r[mC]),
    prio: r[pC] || 'Média', status: r[stC] || 'Pendente',
    tempo: (r[tmC] === null || r[tmC] === undefined || r[tmC] === '' || isNaN(parseFloat(r[tmC]))) ? null : parseFloat(r[tmC]),
    rec: r[rC] || '', anomalia: r[anC] || ''
  }));
}
function rawToRecords(raw) {
  return raw.map(r => { const t = r[6]; const tempo = (t === null || t === undefined || t === '') ? null : parseFloat(t);
    return { unidade: r[0], setor: r[1], tag: r[2], mes: r[3], prio: r[4], status: r[5], tempo: isNaN(tempo) ? null : tempo, rec: r[7] || '', anomalia: r[8] || '' }; });
}
// Padroniza textos para agrupar corretamente (ex.: "GA203F " = "GA-203F"; "Media" = "Média"; "Nota Aberta" = "Nota aberta")
function clean(recs) {
  const setorCanon = {};
  recs.forEach(d => { const k = nrm(d.setor); setorCanon[k] = setorCanon[k] || {}; setorCanon[k][d.setor] = (setorCanon[k][d.setor] || 0) + 1; });
  const pick = o => Object.entries(o).sort((a, b) => b[1] - a[1])[0][0];
  return recs.filter(d => d.mes && d.mes !== 'N/A').map(d => {
    const st = nrm(d.status);
    const status = st.startsWith('realiz') ? 'Realizado' : st.startsWith('pend') ? 'Pendente' : st.startsWith('nota') ? 'Nota aberta'
      : st.startsWith('em and') ? 'Em Andamento' : (String(d.status).trim() || 'Pendente');
    const p = nrm(d.prio);
    const prio = p.startsWith('alt') ? 'Alta' : p.startsWith('bai') ? 'Baixa' : 'Média';
    return { ...d, setor: pick(setorCanon[nrm(d.setor)]).trim(), tag: String(d.tag).trim().toUpperCase().replace(/[\s-]+/g, ''),
      status, prio, rec: String(d.rec || '').trim(), anomalia: String(d.anomalia || '').trim() };
  });
}

function parseCSVText(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) { const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\r') {} else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; } else f += c; }
  if (f.length || row.length) { row.push(f); rows.push(row); }
  return rows;
}
function csvToObjects(text) {
  const rows = parseCSVText(text).filter(r => r.length && r.some(c => c !== ''));
  if (!rows.length) return [];
  const h = rows[0].map(x => x.trim());
  return rows.slice(1).map(r => { const o = {}; h.forEach((k, i) => o[k] = r[i] !== undefined ? r[i].trim() : ''); return o; });
}

let DATA = null, SOURCE = '', LOADED_AT = null;
async function fromGoogle() {
  const r = await fetch(GOOGLE_SHEETS_CSV_URL_RRP + '&t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return rowsToRecords(csvToObjects(await r.text()));
}
async function fromGitHub() {
  for (const u of GITHUB_XLSX_URLS) {
    try { const r = await fetch(u + '?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) continue;
      const wb = XLSX.read(await r.arrayBuffer(), { type: 'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
      if (rows.length) return rowsToRecords(rows);
    } catch (e) {}
  }
  throw new Error('GitHub indisponível');
}
async function fromSaved() {
  const arr = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
  if (!Array.isArray(arr) || !arr.length) throw new Error('nada salvo');
  return arr;
}
async function fromEmbedded() {
  const html = await (await fetch('index.html?t=' + Date.now(), { cache: 'no-store' })).text();
  const m = html.match(/const RAW=(\[.*?\]);\s*\n/s);
  if (!m) throw new Error('RAW não encontrado');
  return rawToRecords(JSON.parse(m[1]));
}
async function loadData() {
  const sources = [['Google Sheets', fromGoogle], ['GitHub (.xlsx)', fromGitHub], ['último carregamento do dashboard', fromSaved], ['dados embutidos no dashboard', fromEmbedded]];
  setSync('⟳ buscando planilha…');
  for (const [name, fn] of sources) {
    try { const d = clean(await fn()); if (d.length) { DATA = d; SOURCE = name; LOADED_AT = new Date(); build(); return; } }
    catch (e) { console.warn('Fonte falhou:', name, e); }
  }
  setSync('⚠ não foi possível carregar dados');
  if (!DATA) document.getElementById('loading').textContent = 'Não foi possível carregar a planilha. Verifique a conexão e pressione R.';
}

// ============================================================
// CÁLCULOS
// ============================================================
const MESES = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
const fmtMes = m => { const [y, mo] = m.split('-'); return MESES[+mo - 1] + '/' + y.slice(-2); };
const fmtMesLongo = m => { const [y, mo] = m.split('-'); return MESES[+mo - 1] + ' ' + y; };
const fmt = (v, d = 1) => v == null ? '—' : Number(v).toLocaleString('pt-BR', { maximumFractionDigits: d });
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cut = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
const avg = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : null;
const isOpen = d => d.status !== 'Realizado';
const temposOf = d => d.filter(x => x.tempo != null && x.tempo >= 0).map(x => x.tempo);
const countBy = (d, f) => { const m = {}; d.forEach(x => { const k = f(x); m[k] = (m[k] || 0) + 1; }); return m; };
const months = () => [...new Set(DATA.map(d => d.mes))].sort();
const stPill = s => `<span class="pill" style="background:${stColor(s)}1F;color:${stColor(s)}">${esc(s)}</span>`;
const prPill = p => `<span class="pill" style="background:${prColor(p)}1A;color:${prColor(p)}">${p}</span>`;
function lastNMonths(n, offset = 0) { const ms = months(); return ms.slice(Math.max(0, ms.length - n - offset), ms.length - offset); }

// ============================================================
// SLIDES
// ============================================================
let MODE = (new URLSearchParams(location.search).get('modo') || 'gerencial').toLowerCase().startsWith('t') ? 'tecnico' : 'gerencial';
let IDX = 0, CHARTS = [], JOBS = [];

const head = (k, t, right = '') => `<div class="slide-head"><div><div class="kicker">${k}</div><h2>${t}</h2></div>${right}</div>`;
function foot(n, total) {
  const ms = months();
  return `<div class="slide-foot"><span>RRPs Q3 PP4 PE7 · ${MODE === 'tecnico' ? 'Visão técnica' : 'Visão gerencial'}</span>
    <span>Dados: ${esc(SOURCE)} · ${fmtMes(ms[0])}–${fmtMes(ms[ms.length - 1])} · ${n}/${total}</span></div>`;
}

function sCover() {
  const ms = months();
  return `<section class="slide cover">
    <div><span class="mode-pill">${MODE === 'tecnico' ? 'Visão técnica' : 'Visão gerencial'}</span></div>
    <h1>Relatório Q3 PP4 PE7<br><span>Análise de RRPs</span></h1>
    <div class="sub">Braskem · Rotina de Recomendações de Processo · John Crane</div>
    <div class="meta">
      <div>Período<b>${fmtMesLongo(ms[0])} – ${fmtMesLongo(ms[ms.length - 1])}</b></div>
      <div>Registros<b>${DATA.length} RRPs</b></div>
      <div>Dados carregados<b>${LOADED_AT.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</b></div>
    </div>
  </section>`;
}

function sSummary() {
  const d = DATA, n = d.length;
  const real = d.filter(x => !isOpen(x)).length, open = n - real, alta = d.filter(x => x.prio === 'Alta').length;
  const rPct = Math.round(real / n * 100), aPct = Math.round(alta / n * 100);
  const t = avg(temposOf(d));
  const cur = lastNMonths(3), prev = lastNMonths(3, 3);
  const nCur = d.filter(x => cur.includes(x.mes)).length, nPrev = d.filter(x => prev.includes(x.mes)).length;
  const openAlta = d.filter(x => isOpen(x) && x.prio === 'Alta').length;
  const rCol = rPct >= 90 ? C.G : rPct >= 70 ? C.A : C.R;
  const health = rPct >= 90 ? 'excelente' : rPct >= 70 ? 'boa' : 'que requer atenção';
  const varTxt = nPrev ? ((nCur - nPrev) / nPrev * 100) : null;
  return `<section class="slide">
    ${head('Resumo executivo', 'Situação geral das RRPs')}
    <div class="col" style="flex:1;gap:36px;justify-content:center;padding-bottom:30px">
      <div class="headline"><b>${rPct}% das recomendações implementadas</b> — taxa ${health}.
        ${open ? `${open} em aberto${openAlta ? `, sendo <b>${openAlta} de prioridade alta</b>` : ''}.` : 'Nenhuma pendência em aberto.'}
        Nos últimos 3 meses foram ${nCur} novas RRPs${varTxt != null ? ` (${varTxt > 0 ? '+' : ''}${fmt(varTxt, 0)}% vs. 3 meses anteriores)` : ''}.</div>
      <div class="kpis">
        <div class="card kpi" style="--c:${C.ACC}"><div class="lbl">Total de RRPs</div><div class="val">${n}</div><div class="note">${months().length} meses de registro</div></div>
        <div class="card kpi" style="--c:${rCol}"><div class="lbl">Realizadas</div><div class="val">${rPct}<small>%</small></div><div class="note">${real} de ${n} concluídas</div></div>
        <div class="card kpi" style="--c:${open > 5 ? C.R : open ? C.A : C.G}"><div class="lbl">Em aberto</div><div class="val">${open}</div><div class="note">pendente, nota aberta ou em andamento</div></div>
        <div class="card kpi" style="--c:${C.R}"><div class="lbl">Prioridade alta</div><div class="val">${aPct}<small>%</small></div><div class="note">${alta} RRPs</div></div>
        <div class="card kpi" style="--c:${C.P}"><div class="lbl">Tempo médio</div><div class="val">${fmt(t)}<small> d</small></div><div class="note">para implementar</div></div>
      </div>
      <div class="kpis" style="grid-template-columns:repeat(${Math.min(5, Object.keys(countBy(d, x => x.setor)).length)},1fr)">
        ${Object.entries(countBy(d, x => x.setor)).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([s, c]) => {
          const o = d.filter(x => x.setor === s && isOpen(x)).length;
          return `<div class="card" style="padding:18px 24px"><div style="font-weight:700;font-size:20px">${esc(s)}</div>
            <div class="muted" style="font-size:17px;margin-top:4px">${c} RRPs · ${o ? `<span style="color:${C.A};font-weight:600">${o} em aberto</span>` : `<span style="color:${C.G};font-weight:600">em dia</span>`}</div></div>`;
        }).join('')}
      </div>
    </div>
  </section>`;
}

function sTimeline() {
  const ms = months(), id = 'ch-tl';
  const g = {}; ms.forEach(m => g[m] = { R: 0, O: 0, A: 0 });
  DATA.forEach(r => { g[r.mes][isOpen(r) ? 'O' : 'R']++; if (r.prio === 'Alta') g[r.mes].A++; });
  JOBS.push(() => new Chart(document.getElementById(id), {
    data: { labels: ms.map(fmtMes), datasets: [
      { type: 'bar', label: 'Realizadas', data: ms.map(m => g[m].R), backgroundColor: C.G + 'D0', borderRadius: 5, stack: 's', order: 2 },
      { type: 'bar', label: 'Em aberto', data: ms.map(m => g[m].O), backgroundColor: C.A + 'D0', borderRadius: 5, stack: 's', order: 2 },
      { type: 'line', label: 'Prioridade alta', data: ms.map(m => g[m].A), borderColor: C.R, backgroundColor: C.R, borderWidth: 3, pointRadius: 4, tension: .3, order: 1 }
    ] }, options: opts({ stacked: true, yTitle: 'RRPs por mês' })
  }));
  const peak = ms.reduce((a, m) => (g[m].R + g[m].O) > (g[a].R + g[a].O) ? m : a, ms[0]);
  return `<section class="slide">
    ${head('Evolução mensal', 'RRPs abertas por mês', `<div class="muted" style="font-size:18px;text-align:right">Pico: ${fmtMesLongo(peak)} (${g[peak].R + g[peak].O} RRPs)<br>Média: ${fmt(DATA.length / ms.length)} por mês</div>`)}
    <div class="card chart-box" style="padding:24px"><canvas id="${id}"></canvas></div>
  </section>`;
}

function sSetores() {
  const sg = {}; DATA.forEach(r => { sg[r.setor] = sg[r.setor] || { t: 0, a: 0, ts: [] }; sg[r.setor].t++; if (r.prio === 'Alta') sg[r.setor].a++; if (r.tempo != null && r.tempo >= 0) sg[r.setor].ts.push(r.tempo); });
  const sl = Object.keys(sg).sort((a, b) => sg[b].t - sg[a].t);
  const tl = sl.filter(s => sg[s].ts.length).map(s => [s, avg(sg[s].ts)]).sort((a, b) => b[1] - a[1]);
  JOBS.push(() => new Chart(document.getElementById('ch-set'), { type: 'bar',
    data: { labels: sl, datasets: [
      { label: 'Total', data: sl.map(s => sg[s].t), backgroundColor: C.A + 'C8', borderRadius: 5 },
      { label: 'Prioridade alta', data: sl.map(s => sg[s].a), backgroundColor: C.R + 'C8', borderRadius: 5 }] },
    options: opts({ horizontal: true }) }));
  JOBS.push(() => new Chart(document.getElementById('ch-tmp'), { type: 'bar',
    data: { labels: tl.map(x => x[0]), datasets: [{ label: 'Dias (média)', data: tl.map(x => +x[1].toFixed(1)), backgroundColor: C.P + 'C8', borderRadius: 5 }] },
    options: opts({ horizontal: true, legend: false }) }));
  return `<section class="slide">
    ${head('Setores', 'Onde estão as recomendações')}
    <div class="body">
      <div class="card col" style="flex:1.2;gap:0"><div class="card-t">RRPs por setor</div><div class="chart-box"><canvas id="ch-set"></canvas></div></div>
      <div class="card col" style="flex:1;gap:0"><div class="card-t">Tempo médio de implementação (dias)</div><div class="chart-box"><canvas id="ch-tmp"></canvas></div></div>
    </div>
  </section>`;
}

function sOpen() {
  const po = { Alta: 0, 'Média': 1, Baixa: 2 };
  const list = DATA.filter(isOpen).sort((a, b) => po[a.prio] - po[b.prio] || a.mes.localeCompare(b.mes));
  const MAX = 8, shown = list.slice(0, MAX);
  const ms = months(), last = ms[ms.length - 1];
  const age = m => { const [y1, m1] = m.split('-').map(Number), [y2, m2] = last.split('-').map(Number); return (y2 - y1) * 12 + (m2 - m1); };
  const rows = shown.map(r => `<tr><td class="tag">${esc(r.tag)}</td><td>${esc(r.setor)}</td><td>${fmtMes(r.mes)}</td>
      <td>${prPill(r.prio)}</td><td>${stPill(r.status)}</td><td class="txt">${esc(cut(r.anomalia || '—', 95))}<br><span style="color:${C.ACC};font-weight:600">${esc(r.rec)}</span></td></tr>`).join('');
  return `<section class="slide">
    ${head('Pendências', 'RRPs em aberto', `<div class="muted" style="font-size:18px;text-align:right">${list.length} em aberto · ordenadas por prioridade e antiguidade${list.length ? `<br>mais antiga: ${fmtMes(list.reduce((a, b) => a.mes < b.mes ? a : b).mes)} (${age(list.reduce((a, b) => a.mes < b.mes ? a : b).mes)} meses)` : ''}</div>`)}
    <div class="body">${list.length ? `<div class="card" style="flex:1;padding:16px 26px;overflow:hidden">
      <table><thead><tr><th>Tag</th><th>Setor</th><th>Mês</th><th>Prioridade</th><th>Status</th><th>Anomalia / ação recomendada</th></tr></thead><tbody>${rows}</tbody></table>
      ${list.length > MAX ? `<div class="muted" style="font-size:16px;margin-top:10px">+ ${list.length - MAX} outras pendências — ver tabela completa no dashboard</div>` : ''}
    </div>` : `<div class="empty">✓ Nenhuma RRP em aberto</div>`}</div>
  </section>`;
}

function sRanking() {
  const tg = {}; DATA.forEach(r => { tg[r.tag] = tg[r.tag] || { c: 0, s: r.setor, st: {} }; tg[r.tag].c++; tg[r.tag].st[r.status] = (tg[r.tag].st[r.status] || 0) + 1; });
  const top = Object.entries(tg).sort((a, b) => b[1].c - a[1].c).slice(0, 10);
  const mx = top[0] ? top[0][1].c : 1;
  const share = Math.round(top.slice(0, 3).reduce((s, x) => s + x[1].c, 0) / DATA.length * 100);
  const rows = top.map(([tag, v], i) => {
    const seg = Object.keys(v.st).sort(stSort).map(k => `<span style="width:${v.st[k] / v.c * 100}%;background:${stColor(k)}"></span>`).join('');
    const open = v.c - (v.st['Realizado'] || 0);
    return `<div class="rank-row"><span class="rank-n ${i < 3 ? 'top' : ''}">${i + 1}</span><b>${esc(tag)}</b><span class="muted">${esc(v.s)}</span>
      <div style="width:100%"><div class="stk" style="width:${Math.round(v.c / mx * 100)}%">${seg}</div></div>
      <b style="text-align:right;font-family:Syne;font-size:24px">${v.c}</b>
      <span>${open ? `<span class="pill" style="background:${C.A}1F;color:${C.A}">${open} em aberto</span>` : `<span class="pill" style="background:${C.G}1F;color:${C.G}">Em dia</span>`}</span></div>`;
  }).join('');
  const sts = [...new Set(DATA.map(r => r.status))].sort(stSort);
  return `<section class="slide">
    ${head('Reincidência', 'Equipamentos com mais RRPs', `<div class="muted" style="font-size:18px;text-align:right">Top 3 = ${share}% de todas as RRPs<br>${sts.map(s => `<span class="dot" style="background:${stColor(s)};margin:0 6px 0 12px"></span>${s}`).join('')}</div>`)}
    <div class="card" style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:14px 30px">${rows}</div>
  </section>`;
}

function sRecs() {
  const rc = Object.entries(countBy(DATA.filter(r => r.rec), r => r.rec)).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const sts = [...new Set(DATA.map(r => r.status))].sort(stSort);
  JOBS.push(() => new Chart(document.getElementById('ch-rec'), { type: 'bar',
    data: { labels: rc.map(x => x[0]), datasets: sts.map(s => ({ label: s, data: rc.map(x => DATA.filter(r => r.rec === x[0] && r.status === s).length), backgroundColor: stColor(s) + 'D8', borderRadius: 4 })) },
    options: opts({ horizontal: true, stacked: true }) }));
  const top = rc[0];
  return `<section class="slide">
    ${head('Ações recomendadas', 'Tipos de ação e situação', top ? `<div class="muted" style="font-size:18px;text-align:right">"${esc(top[0])}" lidera:<br>${top[1]} RRPs (${Math.round(top[1] / DATA.length * 100)}%)</div>` : '')}
    <div class="card chart-box" style="padding:24px"><canvas id="ch-rec"></canvas></div>
  </section>`;
}

function sHeatmap() {
  const setores = Object.entries(countBy(DATA, r => r.setor)).sort((a, b) => b[1] - a[1]).map(x => x[0]);
  const mat = {}; setores.forEach(s => mat[s] = { Alta: 0, 'Média': 0, Baixa: 0 });
  DATA.forEach(r => mat[r.setor][r.prio]++);
  const mx = Math.max(1, ...setores.flatMap(s => PRIOS.map(p => mat[s][p])));
  const rgb = { Alta: '173,46,46', 'Média': '168,110,34', Baixa: '79,104,53' };
  const cells = setores.map(s => `<div class="hm-lbl">${esc(s)}</div>` + PRIOS.map(p => { const v = mat[s][p], t = v / mx;
    return `<div class="hm-cell" style="background:rgba(${rgb[p]},${.08 + t * .8});color:${t > .45 ? '#fff' : `rgb(${rgb[p]})`}">${v || ''}</div>`; }).join('') + `<div class="hm-cell" style="background:transparent;color:var(--txt);justify-content:flex-end">${setores.length ? Object.values(mat[s]).reduce((a, b) => a + b, 0) : ''}</div>`).join('');
  return `<section class="slide">
    ${head('Mapa de calor', 'Setor × prioridade')}
    <div class="card" style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:26px 40px">
      <div class="hm" style="grid-template-columns:260px repeat(3,1fr) 120px">
        <div></div>${PRIOS.map(p => `<div class="hm-h">${p}</div>`).join('')}<div class="hm-h" style="text-align:right">Total</div>
        ${cells}
      </div>
    </div>
  </section>`;
}

function sTempo() {
  const ts = DATA.filter(r => r.tempo != null && r.tempo >= 0);
  const B = [['Mesmo dia', 0, 0], ['1–7 dias', 1, 7], ['8–30 dias', 8, 30], ['31–90 dias', 31, 90], ['> 90 dias', 91, Infinity]];
  const cnt = B.map(([, a, b]) => ts.filter(r => r.tempo >= a && r.tempo <= b).length);
  JOBS.push(() => new Chart(document.getElementById('ch-dist'), { type: 'bar',
    data: { labels: B.map(b => b[0]), datasets: [{ label: 'RRPs', data: cnt, backgroundColor: [C.G, C.O, C.A, C.ACC, C.R].map(c => c + 'D0'), borderRadius: 6 }] },
    options: opts({ legend: false, yTitle: 'Quantidade de RRPs' }) }));
  const slow = ts.slice().sort((a, b) => b.tempo - a.tempo).slice(0, 6);
  const sorted = ts.map(r => r.tempo).sort((a, b) => a - b);
  const med = sorted.length ? sorted[Math.floor(sorted.length / 2)] : null;
  const ate7 = ts.length ? Math.round((cnt[0] + cnt[1]) / ts.length * 100) : 0;
  return `<section class="slide">
    ${head('Tempo de implementação', 'Velocidade de resposta', `<div class="muted" style="font-size:18px;text-align:right">Mediana: ${fmt(med, 0)} dias · média: ${fmt(avg(sorted))} dias<br>${ate7}% resolvidas em até 7 dias</div>`)}
    <div class="body">
      <div class="card col" style="flex:1;gap:0"><div class="card-t">Distribuição do tempo (RRPs realizadas)</div><div class="chart-box"><canvas id="ch-dist"></canvas></div></div>
      <div class="card" style="width:640px;padding:18px 24px"><div class="card-t">Maiores tempos</div>
        <table><thead><tr><th>Tag</th><th>Mês</th><th>Ação</th><th class="num">Dias</th></tr></thead><tbody>
        ${slow.map(r => `<tr><td class="tag">${esc(r.tag)}</td><td>${fmtMes(r.mes)}</td><td class="txt">${esc(cut(r.rec, 30))}</td><td class="num" style="font-weight:700;color:${C.R}">${fmt(r.tempo, 0)}</td></tr>`).join('')}
        </tbody></table></div>
    </div>
  </section>`;
}

function sRecorrentes() {
  const tg = {}; DATA.forEach(r => { (tg[r.tag] = tg[r.tag] || []).push(r); });
  const top = Object.entries(tg).filter(([, v]) => v.length >= 2).sort((a, b) => b[1].length - a[1].length).slice(0, 6);
  const cards = top.map(([tag, v]) => {
    const recs = Object.entries(countBy(v.filter(r => r.rec), r => r.rec)).sort((a, b) => b[1] - a[1]).slice(0, 2);
    const last = v.slice().sort((a, b) => b.mes.localeCompare(a.mes))[0];
    const open = v.filter(isOpen).length;
    return `<div class="card" style="padding:18px 24px;border-left:6px solid ${open ? C.A : C.G}">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-family:Syne;font-weight:800;font-size:26px">${esc(tag)}</span>
        <span class="muted" style="font-size:16px">${esc(v[0].setor)} · <b style="color:var(--txt)">${v.length} RRPs</b>${open ? ` · <span style="color:${C.A};font-weight:600">${open} aberta${open > 1 ? 's' : ''}</span>` : ''}</span></div>
      <div style="font-size:16px;margin-top:8px">${recs.map(([k, c]) => `<span class="pill" style="background:${C.ACC}17;color:${C.ACC};margin-right:6px">${esc(k)} ×${c}</span>`).join('')}</div>
      <div class="muted" style="font-size:15px;margin-top:8px;line-height:1.35"><b>Última (${fmtMes(last.mes)}):</b> ${esc(cut(last.anomalia || '—', 120))}</div>
    </div>`;
  }).join('');
  return `<section class="slide">
    ${head('Análise de reincidência', 'Padrões por equipamento')}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:22px;align-content:center;flex:1;padding-bottom:30px">${cards}</div>
  </section>`;
}

function sRecent() {
  const ms = lastNMonths(2);
  const list = DATA.filter(r => ms.includes(r.mes)).sort((a, b) => b.mes.localeCompare(a.mes) || (isOpen(b) - isOpen(a)));
  const MAX = 9;
  const rows = list.slice(0, MAX).map(r => `<tr><td class="tag">${esc(r.tag)}</td><td>${fmtMes(r.mes)}</td><td>${prPill(r.prio)}</td><td>${stPill(r.status)}</td>
    <td class="txt">${esc(cut(r.anomalia || '—', 105))}</td><td class="num">${r.tempo != null ? fmt(r.tempo, 0) + ' d' : '—'}</td></tr>`).join('');
  return `<section class="slide">
    ${head('Registros recentes', 'RRPs de ' + ms.map(fmtMesLongo).join(' e '), `<div class="muted" style="font-size:18px;text-align:right">${list.length} registros no período</div>`)}
    <div class="card" style="flex:1;padding:16px 26px;overflow:hidden">
      <table><thead><tr><th>Tag</th><th>Mês</th><th>Prioridade</th><th>Status</th><th>Anomalia</th><th class="num">Tempo</th></tr></thead><tbody>${rows}</tbody></table>
      ${list.length > MAX ? `<div class="muted" style="font-size:16px;margin-top:10px">+ ${list.length - MAX} registros — ver tabela completa no dashboard</div>` : ''}
    </div>
  </section>`;
}

// ---------- Chart helper ----------
function opts({ stacked, horizontal, legend = true, yTitle }) {
  const tick = { font: { size: 15, family: 'Inter' }, color: '#635C50' };
  const o = {
    responsive: true, maintainAspectRatio: false, animation: { duration: 500 }, indexAxis: horizontal ? 'y' : 'x',
    plugins: { legend: { display: legend, position: 'bottom', labels: { font: { size: 16, family: 'Inter' }, color: '#18150F', boxWidth: 16, padding: 18 } },
      tooltip: { backgroundColor: '#18150F', titleFont: { size: 15 }, bodyFont: { size: 15 }, padding: 10 } },
    scales: {
      x: { stacked: !!stacked, ticks: { ...tick, maxRotation: 0, autoSkipPadding: 10 }, grid: { display: !!horizontal, color: '#ECE7DE' } },
      y: { stacked: !!stacked, ticks: tick, grid: { display: !horizontal, color: '#ECE7DE' }, beginAtZero: true,
           title: { display: !!yTitle, text: yTitle, font: { size: 16 }, color: '#635C50' } }
    }
  };
  return o;
}

// ============================================================
// MONTAGEM / NAVEGAÇÃO
// ============================================================
function build() {
  CHARTS.forEach(c => c.destroy()); CHARTS = []; JOBS = [];
  const html = MODE === 'tecnico'
    ? [sCover(), sSummary(), sTimeline(), sSetores(), sOpen(), sRanking(), sRecs(), sHeatmap(), sTempo(), sRecorrentes(), sRecent()]
    : [sCover(), sSummary(), sTimeline(), sSetores(), sOpen(), sRanking()];
  const deck = document.getElementById('deck');
  deck.innerHTML = html.join('');
  const slides = deck.querySelectorAll('.slide');
  slides.forEach((s, n) => { if (n > 0) s.insertAdjacentHTML('beforeend', foot(n + 1, slides.length)); });
  JOBS.forEach(j => { try { CHARTS.push(j()); } catch (e) { console.warn(e); } });
  IDX = Math.min(IDX, slides.length - 1);
  document.getElementById('loading').style.display = 'none';
  document.getElementById('btn-ger').classList.toggle('on', MODE === 'gerencial');
  document.getElementById('btn-tec').classList.toggle('on', MODE === 'tecnico');
  setSync('✓ ' + SOURCE + ' · ' + LOADED_AT.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }));
  show();
}
function show() {
  const slides = document.querySelectorAll('.slide');
  slides.forEach((s, n) => s.classList.toggle('active', n === IDX));
  document.getElementById('counter').textContent = (IDX + 1) + ' / ' + slides.length;
  document.getElementById('progress').style.width = ((IDX + 1) / slides.length * 100) + '%';
}
function go(d) { const n = document.querySelectorAll('.slide').length; IDX = Math.max(0, Math.min(n - 1, IDX + d)); show(); }
function setMode(m) {
  if (m === MODE || !DATA) return;
  MODE = m; IDX = 0;
  const u = new URL(location.href); u.searchParams.set('modo', m); history.replaceState(null, '', u);
  build();
}
function setSync(t) { document.getElementById('sync').textContent = t; }
function toggleFS() { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {}); else document.exitFullscreen?.(); }
function fit() { const s = Math.min(window.innerWidth / 1600, window.innerHeight / 900); document.getElementById('deck').style.transform = `scale(${s})`; }

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(k)) { e.preventDefault(); go(1); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); go(-1); }
  else if (k === 'Home') { IDX = 0; show(); }
  else if (k === 'End') { IDX = 999; go(0); }
  else if (k === 'f' || k === 'F') toggleFS();
  else if (k === 'm' || k === 'M') setMode(MODE === 'tecnico' ? 'gerencial' : 'tecnico');
  else if (k === 'r' || k === 'R') loadData();
  else if (k === 'p' || k === 'P') window.print();
  poke();
});
let _tx = null;
document.addEventListener('touchstart', e => { _tx = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => { if (_tx == null) return; const dx = e.changedTouches[0].clientX - _tx; if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1); _tx = null; poke(); });
let _hideT;
function poke() { const c = document.getElementById('controls'); c.classList.remove('hidden'); clearTimeout(_hideT); _hideT = setTimeout(() => c.classList.add('hidden'), 3000); }
document.addEventListener('mousemove', poke);

window.addEventListener('resize', fit);
fit(); poke();
loadData();
setInterval(() => { if (!document.hidden) loadData(); }, AUTO_REFRESH_MS);
</script>
</body>
</html>
